<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secure Login</title>

<style>
/* BACKGROUND */
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
}

/* GLASS CARD */
.glass-card{
    width:380px;
    padding:35px;
    border-radius:22px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);
    box-shadow:0 25px 60px rgba(0,0,0,0.45);
    border:1px solid rgba(255,255,255,0.2);
    color:white;
}

/* TITLE */
.glass-card h2{
    text-align:center;
    margin-bottom:8px;
    font-size:24px;
}

.subtitle{
    text-align:center;
    font-size:13px;
    margin-bottom:25px;
    opacity:0.85;
}

/* INPUTS */
.glass-card input{
    width:100%;
    padding:13px;
    margin:12px 0;
    border-radius:12px;
    border:none;
    outline:none;
    background:rgba(255,255,255,0.9);
    font-size:14px;
}

/* BUTTON */
.glass-card button{
    width:100%;
    padding:13px;
    margin-top:15px;
    border:none;
    border-radius:12px;
    background:#004e92;
    color:white;
    font-size:16px;
    cursor:pointer;
}

.glass-card button:hover{
    background:#003b73;
}

/* FOOT LINKS */
.links{
    margin-top:18px;
    text-align:center;
    font-size:13px;
}

.links a{
    color:#cfe8ff;
    text-decoration:none;
}

.lock{
    text-align:center;
    font-size:38px;
    margin-bottom:10px;
}
</style>

</head>
<body>

<div class="glass-card">
    <div class="lock">🔒</div>
    <h2>Secure Login</h2>
    <div class="subtitle">Intelligent Financial Assistant</div>

    <form method="POST" action="/login">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>

        <button type="submit">Login</button>
    </form>

    <div class="links">
        <a href="#">Forgot password?</a>
    </div>
</div>

</body>
</html>
