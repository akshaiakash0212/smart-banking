<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Notification Center</title>

<style>

body{
    margin:0;
    font-family:'Segoe UI', sans-serif;
    background:linear-gradient(135deg,#0f172a,#020617,#0f172a);
    color:white;
    overflow-x:hidden;
}

/* HEADER */
.header{
    padding:20px 30px;
    background:linear-gradient(90deg,#06b6d4,#7c3aed);
    font-size:22px;
    font-weight:bold;
    box-shadow:0 0 25px rgba(124,58,237,0.6);
}

/* CONTAINER */
.container{
    max-width:700px;
    margin:40px auto;
    padding:20px;
}

/* CARD */
.notification-card{

    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(20px);

    border-radius:16px;
    padding:18px 20px;
    margin-bottom:18px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    border:1px solid rgba(255,255,255,0.08);

    box-shadow:
        0 0 18px rgba(6,182,212,0.25),
        inset 0 0 10px rgba(124,58,237,0.15);

    animation:slideUp 0.5s ease forwards;

    transition:0.3s;
}

/* Hover */
.notification-card:hover{
    transform:translateY(-4px) scale(1.02);
    box-shadow:
        0 0 25px rgba(6,182,212,0.6),
        0 0 40px rgba(124,58,237,0.4);
}

/* Unread glow */
.unread{

    border-left:5px solid #06b6d4;

    box-shadow:
        0 0 25px rgba(6,182,212,0.7),
        inset 0 0 12px rgba(6,182,212,0.4);
}

/* ICON */
.icon{
    font-size:26px;
    margin-right:15px;
}

/* LEFT SIDE */
.left{
    display:flex;
    align-items:center;
}

/* TEXT */
.title{
    font-size:16px;
    font-weight:600;
}

.desc{
    font-size:13px;
    color:#94a3b8;
}

/* TIME */
.time{
    font-size:12px;
    color:#64748b;
}

/* BUTTON */
.mark-read{

    background:linear-gradient(90deg,#06b6d4,#7c3aed);
    border:none;
    color:white;
    padding:8px 14px;
    border-radius:10px;
    cursor:pointer;
    font-size:12px;

    box-shadow:0 0 15px rgba(124,58,237,0.6);

    transition:0.3s;
}

.mark-read:hover{
    transform:scale(1.1);
}

/* MARK READ ANIMATION */
.fade-out{

    animation:fadeOut 0.5s forwards;
}

/* FLOATING BELL */
.bell{

    position:fixed;
    bottom:25px;
    right:25px;

    font-size:40px;

    animation:float 2s infinite ease-in-out;
}

/* ANIMATIONS */

@keyframes slideUp{

    from{
        opacity:0;
        transform:translateY(30px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes fadeOut{

    to{
        opacity:0;
        transform:translateX(100px);
    }
}

@keyframes float{

    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-10px)}
}

</style>
</head>

<body>

<div class="header">
🔔 Notification Center
</div>

<div class="container">

<div class="notification-card unread">

<div class="left">
<div class="icon">💰</div>
<div>
<div class="title">Salary Credited</div>
<div class="desc">₹45,000 credited to your account</div>
</div>
</div>

<div>
<div class="time">2 min ago</div>
<button class="mark-read" onclick="markRead(this)">Mark Read</button>
</div>

</div>


<div class="notification-card unread">

<div class="left">
<div class="icon">📈</div>
<div>
<div class="title">Stock Price Alert</div>
<div class="desc">Reliance up by 4.2%</div>
</div>
</div>

<div>
<div class="time">10 min ago</div>
<button class="mark-read" onclick="markRead(this)">Mark Read</button>
</div>

</div>


<div class="notification-card">

<div class="left">
<div class="icon">🏦</div>
<div>
<div class="title">Loan EMI Deducted</div>
<div class="desc">₹5,000 EMI paid successfully</div>
</div>
</div>

<div>
<div class="time">Today</div>
</div>

</div>


<div class="notification-card unread">

<div class="left">
<div class="icon">⚠</div>
<div>
<div class="title">High Spend Alert</div>
<div class="desc">You spent ₹12,000 today</div>
</div>
</div>

<div>
<div class="time">Today</div>
<button class="mark-read" onclick="markRead(this)">Mark Read</button>
</div>

</div>

</div>

<div class="bell">
🔔
</div>

<script>

function markRead(btn){

    let card = btn.parentElement.parentElement;

    card.classList.remove("unread");

    card.classList.add("fade-out");

    setTimeout(()=>{
        card.remove();
    },500);

}

</script>

</body>
</html>
